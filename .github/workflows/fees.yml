# What pump actually charges, on its own, in a log short enough to read.
#
# Every dollar figure in BUILD.md section 3 is priced off the creator fee, and
# the range the spec quotes came from pump's documentation rather than from
# pump. This reads the FeeConfig accounts themselves. It is one RPC read per
# schedule, so it is cheap enough to re-run whenever the number is questioned.
name: fees

on:
  push:
    branches: [claude/charlie-posts-project-status-uyafps]
    paths:
      - "tools/fee_tiers.py"
      - "tools/smoke_fixture_cashback.py"
      - ".github/workflows/fees.yml"
  workflow_dispatch:

concurrency:
  group: fees
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHARLIE_RPC_URLS: https://crowd-api-gateway.vercel.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The creator fee schedule
        run: python tools/fee_tiers.py

      # The enrol preflight now refuses a coin whose bonding curve reports
      # Trader Cashback true. scripts/smoke.py builds a real enrol
      # transaction against one fixture coin on every deploy, so whether that
      # fixture is a cashback coin decides whether the deploy check survives
      # the change. Reads one account.
      - name: Is the smoke fixture a cashback coin
        run: python tools/smoke_fixture_cashback.py
